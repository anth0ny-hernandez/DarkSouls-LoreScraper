<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="darksouls.css">
        <title>
            World of Dark Souls
        </title>
        <meta charset="utf-8">
    </head>
    <!-- Important: Will need to install django-cors-headers package to solve
     the issue of Cross-Origin Request Block ===>
     "https://pypi.org/project/django-cors-headers/" -->
    <body onload="apiCall()">
        <script src="api_call.js"></script>
        <header>
            <h1 style="text-align: center;">"Be safe my friend, and don't you dare go hollow."</h1>
        </header>
        <ul>
            <li><a href="ds_armor.html">Armor</a></li>
            <li><a href="ds_pyromancy.html">Pyromancy</a></li>
            <li><a href="ds_convenants.html">Covenants</a></li>
            <li><a href="ds_rings.html">Rings</a></li>
        </ul>
        <main>
            <form action="" method="get" id="specs_form" onsubmit="getUpdate(event)">
                <label>Sort items by: </label>
                <select name="sort" id="sort" onchange="sortby()">
                    <option value="category">Category</option>
                    <option value="location">Location</option>
                    <option value="tags">Tags</option>
                    <option value="alpha">Alphabetical</option>
                    <option value="rev_alpha">Reverse Alphabetical</option>
                </select>
                <select name="by" id="by">
                    <!-- naming convention is as such as you can only sort 'by' by
                     selecting what/how you want to sort to begin with -->
                </select>
                <script>
                    function sortby() {
                        const selectVal = document.getElementById("sort").value;
                        const dropdownCall = new DjangoCall();
                        switch(selectVal) {
                            case "category":
                                dropdownCall.extractField("category_type");
                                break;
                            case "location":
                                dropdownCall.extractField("item_availability");
                                break;
                            case "tags":
                                dropdownCall.extractField("item_tags");
                                break;
                            case "alpha":
                                dropdownCall.extractField("alphabet");
                                break;
                            case "rev_alpha":
                                dropdownCall.extractField("rev_alphabet");
                                break;
                        }
                    }
                </script>
                <button type="submit" form="specs_form">Go</button>
            </form>
            <script>
                function getUpdate(event) {
                    event.preventDefault();
                    const idk = new DjangoCall();
                    idk.updatePage();
                }
            </script>
            <!-- insert javascript code here -->
             
            <table>
                <tr>
                    <th>Icon</th>
                    <th>Name</th>
                    <th>Usage</th>
                    <th>Location</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Comments</th>
                    <th>Tags</th>
                </tr>
                <tbody id="lore-table">
                    <!-- Populate here... -->
                </tbody>
            </table>
            <script>
                function apiCall() {
                    const defaultVal = new DjangoCall();
                    defaultVal.loadJSON("pyromancy", "category_type");
                }
             </script>
        </main>
    </body>
</html>
